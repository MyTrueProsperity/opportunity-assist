# Netlify configuration — Opportunity Assist (static landing site)
[build]
  publish = "."
  # No build step needed for static HTML/CSS/JS

[functions."sam-gov-crawler-background"]
  schedule = "0 9 * * *"

[functions."grants-gov-crawler-background"]
  schedule = "10 9 * * *"

[functions."foundation-scan-background"]
  schedule = "0 10 * * 1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
