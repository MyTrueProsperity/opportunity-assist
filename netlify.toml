# Netlify configuration — Opportunity Assist (static landing site)
[build]
  publish = "dist"
  command = "node scripts/build.js"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist", "@napi-rs/canvas"]
  included_files = ["data/legacy-watchlist.json", "node_modules/@napi-rs/canvas-linux-x64-gnu/**"]

[functions."source-intelligence-background"]
  schedule = "*/5 * * * *"

[functions."sam-gov-crawler-background"]
  schedule = "0 9 * * *"

[functions."grants-gov-crawler-background"]
  schedule = "10 9 * * *"

[functions."foundation-scan-background"]
  schedule = "0 10 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
