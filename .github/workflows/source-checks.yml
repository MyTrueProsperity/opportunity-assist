name: Source intelligence checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Real PostgreSQL research budget checks
        timeout-minutes: 4
        run: pnpm test:research-postgres
      - name: Real PostgreSQL deterministic promotion checks
        timeout-minutes: 4
        run: node scripts/test-deterministic-postgres.cjs
      - run: pnpm build
      - run: pnpm check:functions
