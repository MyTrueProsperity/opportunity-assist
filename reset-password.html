<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset password — Opportunity Assist</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#16242c;background:#0f2e3d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#0f2e3d,#143b4d);line-height:1.55}
    main{width:100%;max-width:420px;padding:32px;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(15,46,61,.08)}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:1.2rem}
    .mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#e0a64a;color:#0f2e3d;font-weight:800}
    .brand small{display:block;color:#5b6b73;font-size:.72rem}
    h1{color:#0f2e3d;font-size:1.4rem;margin:0 0 .5rem}
    p{margin:.5rem 0 1rem}
    label{display:block;font-weight:600;font-size:.85rem;color:#0f2e3d;margin:0 0 .3rem}
    input{width:100%;padding:.65rem .7rem;border:1px solid #d2dfe4;border-radius:9px;font:inherit;margin-bottom:1rem}
    button{width:100%;padding:.7rem 1rem;border:0;border-radius:9px;background:#e0a64a;color:#0f2e3d;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    a{color:#2c7a7b;text-decoration:none}
    a:hover{text-decoration:underline}
    .back{display:block;text-align:center;margin-top:1.2rem;font-size:.9rem}
    .error{color:#b4452f}
    .success{color:#1f8a52}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">OA</span><div><strong>Opportunity Assist</strong><small>A My True Prosperity product</small></div></div>
    <h1>Set a new password</h1>
    <p id="resetStatus" role="status" aria-live="polite">Checking your reset link…</p>
    <form id="resetForm" hidden>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required />
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
      <button id="resetButton" type="submit">Update password</button>
    </form>
    <a class="back" href="/app.html">Back to sign in</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.OA_CONFIG = {
      SUPABASE_URL: "https://girldctsnrdvdoktzfrv.supabase.co",
      SUPABASE_PUBLISHABLE_KEY: "sb_publishable_F4q2lp6s8r2nhugBFfxlFA_B4q85yuI"
    };
  </script>
  <script src="/assets/password-reset.js"></script>
</body>
</html>
